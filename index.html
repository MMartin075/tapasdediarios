<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Kiosco - Tablero de Prensa</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;color:#202020;font-family:Arial,Helvetica,sans-serif}
header{height:82px;background:#171717;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:4px solid #000}
.brand{font-size:25px;font-weight:800;letter-spacing:1px}
.date{font-size:15px;color:#ddd;text-transform:uppercase;letter-spacing:.6px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 82px)}
aside{background:#fafafa;border-right:1px solid #d8d8d8;padding:22px 14px;position:sticky;top:0;height:calc(100vh - 82px);overflow:auto}
.side-title{font-size:12px;font-weight:800;letter-spacing:1.3px;color:#777;margin:0 10px 14px}
.province{margin-bottom:3px;border-radius:6px;overflow:hidden}
.province button{width:100%;border:0;background:transparent;cursor:pointer;text-align:left;padding:11px 12px;font-size:15px;font-weight:700;color:#222;display:flex;justify-content:space-between;align-items:center}
.province button:hover{background:#eee}
.province.active>button{background:#e4e4e4}
.arrow{font-size:12px;color:#666;width:18px;display:inline-block;transition:transform .2s}
.province.open .arrow{transform:rotate(90deg)}
.newspapers{display:none;padding:0 0 7px 18px}
.province.open .newspapers{display:block}
.newspapers button{display:block;width:100%;border:0;background:transparent;padding:7px 10px;text-align:left;font-size:13px;color:#555;cursor:pointer;border-radius:4px}
.newspapers button:hover{background:#eee;color:#111}
main{padding:26px 30px 50px;min-width:0}
.toolbar{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px;gap:20px}
h1{font-size:27px;margin:0 0 5px}
.subtitle{font-size:13px;color:#777}
.status{font-size:12px;color:#555;background:#fff;border:1px solid #d8d8d8;padding:8px 11px;border-radius:6px;white-space:nowrap}
.section{margin:0 0 34px}
.section h2{font-size:14px;text-transform:uppercase;letter-spacing:1.1px;margin:0 0 13px;padding-bottom:9px;border-bottom:2px solid #222}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{background:#fff;border:1px solid #d3d3d3;border-radius:5px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.card-head{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e2e2}
.name{font-weight:800;font-size:14px}
.state{font-size:10px;color:#15803d;font-weight:700}
.cover{aspect-ratio:3/4;background:#e9e9e9;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{text-align:center;color:#888;padding:20px;font-size:13px;line-height:1.5}
.placeholder strong{display:block;color:#555;margin-bottom:4px}
.cover-overlay{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;gap:12px;opacity:0;transition:opacity .2s ease}
.card:hover .cover-overlay{opacity:1}
.btn-action{background:#fff;color:#111;border:none;width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.btn-action:hover{transform:scale(1.1);background:#f0f0f0}
.empty{background:#fff;border:1px dashed #bbb;border-radius:6px;padding:35px;text-align:center;color:#777}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;padding:20px;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal img{max-width:92vw;max-height:90vh;object-fit:contain;background:#fff;border-radius:4px;box-shadow:0 5px 25px rgba(0,0,0,.5)}
.close{position:fixed;top:15px;right:20px;border:0;background:#fff;width:40px;height:40px;border-radius:50%;font-size:24px;cursor:pointer;font-weight:bold;box-shadow:0 2px 10px rgba(0,0,0,.3)}
@media(max-width:700px){header{height:auto;padding:18px;gap:10px;align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid #d8d8d8}main{padding:20px 15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.toolbar{align-items:flex-start;flex-direction:column}}
@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="brand">MI KIOSCO</div>
  <div class="date" id="today"></div>
</header>

<div class="layout">
  <aside>
    <div class="side-title">PROVINCIAS</div>
    <div id="menu"></div>
  </aside>

  <main>
    <div class="toolbar">
      <div>
        <h1 id="viewTitle">Buenos Aires</h1>
        <div class="subtitle">Tapas de la edición del día</div>
      </div>
      <div class="status">V1 · Operativo</div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="modal" id="modal">
  <button class="close" id="closeModal" aria-label="Cerrar">×</button>
  <img id="modalImg" alt="Tapa ampliada">
</div>

<script>
// Fuentes de imágenes en vivo (Mapeo de portadas del día)
const liveSources = {
  "Clarín": { img: "https://estaticos.kiosko.net/ar/750/clarin.jpg", link: "https://www.clarin.com/" },
  "La Nación": { img: "https://estaticos.kiosko.net/ar/750/lanacion.jpg", link: "https://www.lanacion.com.ar/" },
  "Perfil": { img: "https://estaticos.kiosko.net/ar/750/perfil.jpg", link: "https://www.perfil.com/" },
  "Página/12": { img: "https://estaticos.kiosko.net/ar/750/pagina12.jpg", link: "https://www.pagina12.com.ar/" },
  "Crónica": { img: "https://estaticos.kiosko.net/ar/750/cronica.jpg", link: "https://www.cronica.com.ar/" },
  "Diario Popular": { img: "https://estaticos.kiosko.net/ar/750/diario_popular.jpg", link: "https://www.diariopopular.com.ar/" },
  "Ámbito": { img: "https://estaticos.kiosko.net/ar/750/ambito_financiero.jpg", link: "https://www.ambito.com/" },
  "El Cronista": { img: "https://estaticos.kiosko.net/ar/750/cronista_comercial.jpg", link: "https://www.cronista.com/" },
  "Olé": { img: "https://estaticos.kiosko.net/ar/750/ole.jpg", link: "https://www.ole.com.ar/" },
  "La Voz del Interior": { img: "https://estaticos.kiosko.net/ar/750/voz_del_interior.jpg", link: "https://www.lavoz.com.ar/" },
  "La Capital": { img: "https://estaticos.kiosko.net/ar/750/la_capital.jpg", link: "https://www.lacapital.com.ar/" },
  "Los Andes": { img: "https://estaticos.kiosko.net/ar/750/los_andes.jpg", link: "https://www.losandes.com.ar/" },
  "La Gaceta": { img: "https://estaticos.kiosko.net/ar/750/la_gaceta.jpg", link: "https://www.lagaceta.com.ar/" },
  "Río Negro": { img: "https://estaticos.kiosko.net/ar/750/rio_negro.jpg", link: "https://www.rionegro.com.ar/" },
  "El Día": { img: "https://estaticos.kiosko.net/ar/750/el_dia.jpg", link: "https://www.eldia.com/" }
};

const baseData = {
  "Buenos Aires": [
    ["Clarín", "General"], ["La Nación", "General"], ["Perfil", "General"],
    ["Página/12", "General"], ["Crónica", "General"], ["Diario Popular", "General"],
    ["Ámbito", "Economía"], ["El Cronista", "Economía"], ["Olé", "Deportes"]
  ],
  "Córdoba": [["La Voz del Interior", "General"]],
  "Santa Fe": [["La Capital", "General"]],
  "Mendoza": [["Los Andes", "General"]],
  "Tucumán": [["La Gaceta", "General"]],
  "Río Negro": [["Río Negro", "General"]],
  "La Plata / Buenos Aires": [["El Día", "General"]]
};

let liveTapas = { ...liveSources };

const menu = document.getElementById("menu");
const content = document.getElementById("content");
const title = document.getElementById("viewTitle");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

const today = new Date();
document.getElementById("today").textContent = today.toLocaleDateString("es-AR", {
  weekday: "long", day: "2-digit", month: "long", year: "numeric"
});

function card(name) {
  const item = liveTapas[name];
  const imgSrc = item ? item.img : "";
  const webLink = item ? item.link : "#";

  return `
    <article class="card">
      <div class="card-head">
        <span class="name">${name}</span>
        <span class="state">EN VIVO</span>
      </div>
      <div class="cover">
        <img src="${imgSrc}" alt="Tapa de ${name}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'placeholder\\'><strong>${name}</strong>Sin vista previa disponible.</div>';">
        <div class="cover-overlay">
          <button class="btn-action" onclick="openModal('${imgSrc}')" title="Ampliar">🔍</button>
          <a class="btn-action" href="${webLink}" target="_blank" title="Abrir sitio web">↗️</a>
        </div>
      </div>
    </article>
  `;
}

function renderProvince(province) {
  title.textContent = province;
  const items = baseData[province];
  if (!items || !items.length) {
    content.innerHTML = '<div class="empty">Todavía no hay diarios configurados para esta provincia.</div>';
    return;
  }
  const groups = {};
  items.forEach(([name, cat]) => (groups[cat] ??= []).push(name));
  
  content.innerHTML = Object.entries(groups).map(([cat, names]) => `
    <section class="section">
      <h2>${cat}</h2>
      <div class="grid">${names.map(card).join("")}</div>
    </section>
  `).join("");
}

function renderSingle(province, name) {
  title.textContent = name;
  content.innerHTML = `
    <section class="section">
      <h2>${province}</h2>
      <div class="grid">${card(name)}</div>
    </section>
  `;
}

function renderMenu() {
  menu.innerHTML = "";
  Object.keys(baseData).forEach((province, i) => {
    const wrap = document.createElement("div");
    wrap.className = "province" + (i === 0 ? " open active" : "");
    const btn = document.createElement("button");
    btn.innerHTML = `<span><span class="arrow">▶</span>${province}</span><span>${baseData[province].length}</span>`;
    btn.onclick = () => {
      document.querySelectorAll(".province").forEach(x => x.classList.remove("active"));
      wrap.classList.toggle("open");
      wrap.classList.add("active");
      renderProvince(province);
    };
    wrap.appendChild(btn);
    const news = document.createElement("div");
    news.className = "newspapers";
    baseData[province].forEach(([name]) => {
      const nb = document.createElement("button");
      nb.textContent = name;
      nb.onclick = e => {
        e.stopPropagation();
        renderSingle(province, name);
      };
      news.appendChild(nb);
    });
    wrap.appendChild(news);
    menu.appendChild(wrap);
  });
}

function openModal(src) {
  modalImg.src = src;
  modal.classList.add("open");
}

function closeModal() {
  modal.classList.remove("open");
  modalImg.src = "";
}

document.getElementById("closeModal").onclick = closeModal;
modal.onclick = (e) => { if (e.target === modal) closeModal(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

// Si existe un archivo tapas.json local, reescribe los datos
async function fetchLocalJSON() {
  try {
    const res = await fetch("tapas.json");
    if (res.ok) {
      const data = await res.json();
      data.forEach(item => {
        liveTapas[item.nombre] = { img: item.imagen, link: item.enlace };
      });
      renderProvince("Buenos Aires");
    }
  } catch (e) {}
}

renderMenu();
renderProvince("Buenos Aires");
fetchLocalJSON();
</script>
</body>
</html>
